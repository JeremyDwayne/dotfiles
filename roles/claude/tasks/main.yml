- name: "Claude | Config folder"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ ansible_facts['user_dir'] }}/.claude"
    state: directory

- name: "Claude | Symlink core config files"
  ansible.builtin.file:
    src: "{{ role_path }}/files/{{ item }}"
    dest: "{{ ansible_facts['user_dir'] }}/.claude/{{ item }}"
    state: link
    force: true
  loop:
    - CLAUDE.md
    - settings.json
    - statusline.sh
    - claude-app-preferences.md

- name: "Claude | Skills folder"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ ansible_facts['user_dir'] }}/.claude/skills"
    state: directory

- name: "Claude | Find bundled skill folders"
  ansible.builtin.find:
    paths: "{{ role_path }}/files/skills"
    file_type: directory
    recurse: false
  register: claude_skills

- name: "Claude | Symlink each custom skill folder"
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ ansible_facts['user_dir'] }}/.claude/skills/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ claude_skills.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: "Claude | Install Matt Pocock skills"
  ansible.builtin.command: npx --yes skills add mattpocock/skills --global --skill '*' --agent claude-code --yes
  register: claude_skills_add
  changed_when: "'Installed' in claude_skills_add.stdout or 'installed' in claude_skills_add.stdout"

- name: "Claude | Update installed skills"
  ansible.builtin.command: npx --yes skills update --global --yes
  register: claude_skills_update
  changed_when: "'Updated' in claude_skills_update.stdout or 'updated' in claude_skills_update.stdout"
