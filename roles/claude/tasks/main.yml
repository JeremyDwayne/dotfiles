- name: "Claude | Config folder"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ ansible_facts['user_dir'] }}/.claude"
    state: directory

- name: "Claude | Symlink core config files"
  ansible.builtin.file:
    src: "{{ role_path }}/files/{{ item }}"
    dest: "{{ ansible_facts['user_dir'] }}/.claude/{{ item }}"
    state: link
    force: true
  loop:
    - CLAUDE.md
    - settings.json
    - statusline.sh
    - claude-app-preferences.md

- name: "Claude | Skills folder"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ ansible_facts['user_dir'] }}/.claude/skills"
    state: directory

- name: "Claude | Find bundled skill folders"
  ansible.builtin.find:
    paths: "{{ role_path }}/files/skills"
    file_type: directory
    recurse: false
  register: claude_skills

- name: "Claude | Symlink each custom skill folder"
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ ansible_facts['user_dir'] }}/.claude/skills/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ claude_skills.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: "Claude | Hooks folder"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ ansible_facts['user_dir'] }}/.claude/hooks"
    state: directory

- name: "Claude | Find hook scripts"
  ansible.builtin.find:
    paths: "{{ role_path }}/files/hooks"
    patterns: "*.sh"
  register: claude_hooks

- name: "Claude | Symlink each hook script"
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ ansible_facts['user_dir'] }}/.claude/hooks/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ claude_hooks.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: "Claude | Register user-scoped MCP servers"
  ansible.builtin.shell: >-
    {{ claude_bin }} mcp get {{ item.name }} >/dev/null 2>&1 && echo present ||
    {{ claude_bin }} mcp add --scope user --transport http {{ item.name }} {{ item.url }}
  vars:
    claude_bin: "{{ ansible_facts['user_dir'] }}/.local/bin/claude"
  register: claude_mcp_add
  changed_when: "'present' not in claude_mcp_add.stdout"
  loop:
    - { name: submittalkit, url: "https://submittalkit.com/mcp" }
    - { name: submittalkit-admin, url: "https://submittalkit.com/mcp/internal" }
  loop_control:
    label: "{{ item.name }}"

- name: "Claude | Update installed skills"
  ansible.builtin.command: npx --yes skills update --global --yes
  register: claude_skills_update
  changed_when: "'Updated' in claude_skills_update.stdout or 'updated' in claude_skills_update.stdout"
