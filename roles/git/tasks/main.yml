- name: "Git | Install Git"
  community.general.homebrew:
    name: git
    state: latest

- name: "Git | Install GPG"
  community.general.homebrew:
    name: gpg
    state: latest

- name: "Git | Create Git Config Directory"
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/git"
    mode: "0755"
    state: directory

- name: "Git | Move ~/.config/git/gitmessage"
  ansible.builtin.copy:
    src: gitmessage
    dest: "{{ ansible_facts['user_dir'] }}/.config/git/gitmessage"
    mode: "0600"

- name: "Git | Global ignore (~/.config/git/ignore)"
  ansible.builtin.copy:
    src: ignore
    dest: "{{ ansible_facts['user_dir'] }}/.config/git/ignore"
    mode: "0644"

- name: "Git | Configure ~/.config/git/allowed_signers"
  ansible.builtin.copy:
    src: allowed_signers
    dest: "{{ ansible_facts['user_dir'] }}/.config/git/allowed_signers"
    mode: "0600"

- name: "Git | Set user.email"
  community.general.git_config:
    name: user.email
    scope: global
    value: "{{ git_user_email }}"
  no_log: true

- name: "Git | Set global config"
  community.general.git_config:
    name: "{{ item.key }}"
    scope: global
    value: "{{ item.value }}"
  loop: "{{ settings | dict2items }}"
  vars:
    settings:
      core.pager: delta
      interactive.diffFilter: delta --color-only
      delta.navigate: true
      delta.dark: true
      merge.conflictstyle: zdiff3
      diff.colorMoved: zebra
      fetch.prune: true
      init.defaultBranch: main
      pull.rebase: true
      rebase.autoStash: true
      push.autoSetupRemote: true
      push.default: current
      user.name: "{{ git_user_name }}"
      commit.template: "{{ ansible_facts['user_dir'] }}/.config/git/gitmessage"
      user.signingkey: "{{ ansible_facts['user_dir'] }}/.ssh/id_ed25519.pub"
      gpg.format: ssh
      commit.gpgsign: true
      tag.gpgsign: true
      gpg.ssh.allowedSignersFile: "{{ ansible_facts['user_dir'] }}/.config/git/allowed_signers"

- name: "Git | Set Git Aliases"
  community.general.git_config:
    name: "alias.{{ item.key }}"
    scope: global
    value: "{{ item.value }}"
  loop: "{{ aliases | dict2items }}"
  vars:
    aliases:
      aa: add --all
      ap: add --patch
      branches: "for-each-ref --sort=-committerdate --format='%(color:blue)%(authordate:relative)\t%(color:red)%(authorname)\t%(color:white)%(color:bold)%(refname:short)' refs/remotes"
      ca: commit --amend -v
      cam: commit -am
      cm: commit -m
      co: checkout
      commend: commit --amend --no-edit
      conflicts: "!$EDITOR $(git diff --name-only --diff-filter=U)"
      cundo: reset --soft HEAD^
      cv: commit -v
      rh: "!git fetch --all && git reset --hard origin/main"
      shorty: status --short --branch
      st: status
      sync: "!git fetch && git merge main --ff"
      parent: "!git show-branch | sed 's/].*//' | grep '\\*' | grep -v \"$(git rev-parse --abbrev-ref HEAD)\" | head -n1 | sed 's/^.*\\[//'"
