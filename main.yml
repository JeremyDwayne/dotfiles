---
- name: DotFiles Config
  hosts: localhost
  connection: local

  pre_tasks:
    - name: Install mise
      community.general.homebrew:
        name: mise
        state: latest
      tags:
        - always

  tasks:
    - name: Set roles
      ansible.builtin.set_fact:
        run_roles: "{{ (ansible_run_tags != ['all'] and 'all' not in ansible_run_tags) | ternary(ansible_run_tags, default_roles | difference(exclude_roles | default([]))) }}"
      tags:
        - always

    - name: Display roles
      ansible.builtin.debug:
        var: run_roles
      tags:
        - always

    - name: Run roles
      ansible.builtin.include_role:
        apply:
          tags:
            - "{{ roles_item }}"
        name: "{{ roles_item }}"
      loop_control:
        loop_var: roles_item
      with_items: "{{ run_roles }}"
      tags:
        - always
